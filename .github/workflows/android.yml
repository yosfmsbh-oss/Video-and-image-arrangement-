name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Arrange project
        run: |
          mkdir -p src/main/java/com/yousef/farz
          cp MainActivity.kt src/main/java/com/yousef/farz/
          cp AndroidManifest.xml src/main/
          mkdir -p src/main/res/drawable-nodpi src/main/res/mipmap-anydpi src/main/res/values
          cp icon.png src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cat > src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#CBB7AE</color>
          </resources>
          XML
          for n in ic_launcher ic_launcher_round; do
          cat > src/main/res/mipmap-anydpi/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$(find build/outputs/apk/debug -name '*.apk' | head -1)" farz.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "ترتيب الاستديو - نسخة ${{ github.run_number }}"
          files: farz.apk
