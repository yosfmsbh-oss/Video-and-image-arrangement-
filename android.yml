name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Arrange project
        run: |
          mkdir -p src/main/java/com/yousef/farz
          cp MainActivity.kt src/main/java/com/yousef/farz/
          cp AndroidManifest.xml src/main/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$(find build/outputs/apk/debug -name '*.apk' | head -1)" farz.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "فرز الصور - نسخة ${{ github.run_number }}"
          files: farz.apk
